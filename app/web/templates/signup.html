{% extends "base.html" %}
{% block body %}
<section class="panel auth">
  <h1>Create account</h1>
  <p class="note">New accounts are passengers. Search stays open without an account. Reserving a berth needs one.</p>
  {% if error %}<p class="banner bad">{{ error }}</p>{% endif %}
  <form method="post" action="/signup" class="stack">
    <label>Name <input name="name" required minlength="2" maxlength="80" autocomplete="name"></label>
    <label>Email <input name="email" type="email" required maxlength="120" autocomplete="username"></label>
    <label>Password <input name="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password"></label>
    <div class="pair">
      <label>Age <input name="age" type="number" required min="1" max="120" value="30"></label>
      <label>Gender
        <select name="gender" required>
          <option value="F">Female</option>
          <option value="M">Male</option>
          <option value="O">Other</option>
        </select>
      </label>
    </div>
    <button class="solid" type="submit">Create account</button>
  </form>
  <p class="note">Already registered? <a href="/#sign-in">Sign in</a></p>
</section>
{% endblock %}
